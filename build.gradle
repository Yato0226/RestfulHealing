plugins {
    id 'java'
    id 'application'
}

group = 'com.hypixel.hytale.mod'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}

repositories {
    mavenCentral()
    // Add Hytale's repository here if available
    flatDir {
        dirs 'libs' // For local Hytale JAR files
    }
}

dependencies {
    // Hytale server API - referencing the JAR file that exists in the system
    implementation files('C:/Users/louize/AppData/Roaming/Hytale/install/release/package/game/latest/Server/HytaleServer.jar')

    // Or if Hytale provides a Maven repository:
    // implementation 'com.hypixel.hytale:server-api:1.0.0'

    // Common libraries that might be needed
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'it.unimi.dsi:fastutil:8.5.12'
}

// Define source sets properly - main sources and test sources
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

application {
    mainClass = 'com.hypixel.hytale.mod.restfulhealing.RestfulHealingPlugin'
}

jar {
    archiveBaseName = 'RestfulHealing'
    manifest {
        attributes(
            'Main-Class': 'com.hypixel.hytale.mod.restfulhealing.RestfulHealingPlugin',
            'Plugin-ID': 'restfulhealing',
            'Plugin-Name': 'Restful Healing Mod',
            'Plugin-Version': project.version,
            'Plugin-Group': 'com.hypixel.hytale.mod',
            'Plugin-Description': 'Adds intuitive healing mechanics while resting or sleeping, with accelerated regen curves and smart auto-heal thresholds.',
            'Plugin-Author': 'Louize',
            'Plugin-Dependencies': '',
            'Plugin-API-Version': '1.0.0'
        )
    }
}

// Custom task to create the mod JAR with proper structure
task createModJar(type: Jar) {
    archiveBaseName = 'RestfulHealing'
    destinationDirectory = file('.')
    
    from sourceSets.main.output
    
    manifest {
        attributes(
            'Main-Class': 'com.hypixel.hytale.mod.restfulhealing.RestfulHealingPlugin',
            'Plugin-ID': 'restfulhealing',
            'Plugin-Name': 'Restful Healing Mod',
            'Plugin-Version': project.version,
            'Plugin-Group': 'com.hypixel.hytale.mod',
            'Plugin-Description': 'Adds intuitive healing mechanics while resting or sleeping, with accelerated regen curves and smart auto-heal thresholds.',
            'Plugin-Author': 'Louize',
            'Plugin-Dependencies': '',
            'Plugin-API-Version': '1.0.0'
        )
    }
}

// Make sure the default jar task also includes the manifest
jar {
    manifest {
        attributes(
            'Main-Class': 'com.hypixel.hytale.mod.restfulhealing.RestfulHealingPlugin',
            'Plugin-ID': 'restfulhealing',
            'Plugin-Name': 'Restful Healing Mod',
            'Plugin-Version': project.version,
            'Plugin-Group': 'com.hypixel.hytale.mod',
            'Plugin-Description': 'Adds intuitive healing mechanics while resting or sleeping, with accelerated regen curves and smart auto-heal thresholds.',
            'Plugin-Author': 'Louize',
            'Plugin-Dependencies': '',
            'Plugin-API-Version': '1.0.0'
        )
    }
}

// Skip test compilation since the test file uses old API
test {
    enabled = false
}

// Task to copy the built JAR to specified directories
task copyJarToDestinations {
    dependsOn jar
    doLast {
        def jarFile = jar.archiveFile.get()
        def baseName = jar.archiveBaseName.get()
        def version = jar.archiveVersion.get()

        // Copy to Hytale mods directory
        copy {
            from jarFile
            into 'C:/Users/louize/AppData/Roaming/Hytale/UserData/Mods'
            rename { filename ->
                "${baseName}-${version}.jar"
            }
        }

        // Copy to project root directory
        copy {
            from jarFile
            into '.'
            rename { filename ->
                "${baseName}-${version}.jar"
            }
        }
    }
}

// Make sure the copy task runs after build
build.finalizedBy copyJarToDestinations