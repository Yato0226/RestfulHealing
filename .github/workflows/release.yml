name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tag pushes starting with 'v'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Get tag name
      id: tag
      run: |
        echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
    - name: Debug - List all files
      run: find . -name "*.jar" -type f

    - name: Debug - Show build directory
      run: ls -la build/ || echo "build directory doesn't exist"

    - name: Debug - Show build/libs directory
      run: ls -la build/libs/ || echo "build/libs directory doesn't exist"

    - name: Create release assets directory
      run: |
        mkdir -p release_assets
        # Copy all JAR files from build/libs
        if [ -d "build/libs" ]; then
          cp build/libs/*.jar release_assets/ 2>/dev/null || echo "No JAR files in build/libs"
        else
          echo "build/libs directory does not exist"
          find . -name "*.jar" -exec cp {} release_assets/ \; 2>/dev/null || echo "No JAR files found anywhere"
        fi

        # List what we found
        echo "Files in release_assets:"
        ls -la release_assets/ || echo "release_assets directory is empty"

        # Rename the JAR to match the tag version if it exists
        if [ -f "release_assets/RestfulHealing-1.0.0.jar" ]; then
          mv "release_assets/RestfulHealing-1.0.0.jar" "release_assets/RestfulHealing-${{ steps.tag.outputs.VERSION }}.jar"
          echo "Renamed JAR file to match tag version"
        else
          # If there's a JAR file with a different name, rename it
          for jar_file in release_assets/*.jar; do
            if [ -f "$jar_file" ]; then
              mv "$jar_file" "release_assets/RestfulHealing-${{ steps.tag.outputs.VERSION }}.jar"
              echo "Renamed $jar_file to RestfulHealing-${{ steps.tag.outputs.VERSION }}.jar"
              break
            fi
          done
        fi

        echo "Final files in release_assets:"
        ls -la release_assets/
        
    - name: Create source code archive
      run: |
        zip -r "RestfulHealing-${{ steps.tag.outputs.VERSION }}-sources.zip" . -x ".git/*" ".github/*" "build/*" "bin/*" "temp_classes/*" ".gradle/*" "*.jar" "RestfulHealing-*.zip"
        mv "RestfulHealing-${{ steps.tag.outputs.VERSION }}-sources.zip" release_assets/
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: 'Release ${{ steps.tag.outputs.TAG }}'
        draft: false
        prerelease: false
        body: |
          Release ${{ steps.tag.outputs.TAG }} of Restful Healing Mod
          
          ## Changes
          - Auto-generated release from GitHub Actions
          
          ## Files Included
          - JAR file for Hytale mod installation
          - Source code archive for reference
          
    - name: Upload JAR asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release_assets/RestfulHealing-${{ steps.tag.outputs.VERSION }}.jar
        asset_name: RestfulHealing-${{ steps.tag.outputs.VERSION }}.jar
        asset_content_type: application/java-archive
        
    - name: Upload source code asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release_assets/RestfulHealing-${{ steps.tag.outputs.VERSION }}-sources.zip
        asset_name: RestfulHealing-${{ steps.tag.outputs.VERSION }}-sources.zip
        asset_content_type: application/zip